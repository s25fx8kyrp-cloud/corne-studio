CONFIG_ZMK_KEYBOARD_NAME="splitkeeby"
# TEMPORARY DIAGNOSTIC: deep sleep disabled to test if the reconnection problem
# is caused by the deep-sleep wake/reboot path. If reconnection becomes reliable,
# deep sleep is the culprit. Re-enable (=y) once we've confirmed and tuned.
# Trade-off while disabled: faster idle battery drain.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_DISPLAY=y

# STEP 1 of the Matrix-rain rebuild: custom screen that just draws the rain.
# Replaces the stock widget screen, so the WIDGET_* options are off for now.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Keep the OLED on through idle so the rain stays visible while we test.
# (Deep sleep stays OFF in this step to match the known-good baseline.)
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# LVGL label widget + 8x8 monospace bitmap font used by the rain.
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_UNSCII_8=y

# Stock status widgets unused with the custom screen (re-add later if wanted):
# CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
# CONFIG_ZMK_WIDGET_LAYER_STATUS=y
# CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
# CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
# CONFIG_ZMK_WIDGET_WPM_STATUS=y

# Run the OLED on a dedicated thread so display updates don't delay key scanning (fixes lag)
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Boost BLE transmit power for a stronger, more stable connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
