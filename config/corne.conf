CONFIG_ZMK_KEYBOARD_NAME="splitkeeby"
# TEMPORARY DIAGNOSTIC: deep sleep disabled to test if the reconnection problem
# is caused by the deep-sleep wake/reboot path. If reconnection becomes reliable,
# deep sleep is the culprit. Re-enable (=y) once we've confirmed and tuned.
# Trade-off while disabled: faster idle battery drain.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_WPM_STATUS=y

# Run the OLED on a dedicated thread so display updates don't delay key scanning (fixes lag)
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Boost BLE transmit power for a stronger, more stable connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
