CONFIG_ZMK_KEYBOARD_NAME="splitkeeby"
# Deep sleep ON (30 min): powers the board + OLEDs off after long inactivity.
# The earlier diagnostic proved deep sleep is NOT the BT reconnection cause.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Idle (not sleep) after 30s of no keypresses -> this is what flips the OLED
# from the status readout to the Matrix-rain screensaver. Board stays awake.
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_DISPLAY=y

# Custom screen: status while typing, Matrix-rain screensaver when idle.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Keep the OLED powered through the IDLE state so the rain is visible. Without
# this ZMK blanks the display on idle and the screensaver would never show.
# Deep sleep (30 min) still powers the panel off completely.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# LVGL label widget + 8x8 monospace bitmap font used by the rain and status.
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_UNSCII_8=y

# (Layer-number status dropped for now to isolate a central-half crash; the
# battery-only status needs no extra widget flags. Re-add CONFIG_ZMK_WIDGET_LAYER_STATUS
# here when bringing the layer indicator back.)

# Run the OLED on a dedicated thread so display updates don't delay key scanning (fixes lag)
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Boost BLE transmit power for a stronger, more stable connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
