CONFIG_ZMK_KEYBOARD_NAME="splitkeeby"
# Deep sleep re-enabled. The earlier diagnostic proved deep sleep was NOT the
# cause of the BT reconnection issue, so it's back on for battery life.
# Deep sleep powers the board (and OLED) down after 30 min of inactivity.
# We'll keep an eye on reconnection now that it's on again.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Idle (not deep sleep) after 30s of no keypresses. This is what triggers the
# OLED to switch from the status screen to the Matrix-rain screensaver. The
# board stays fully awake/connected; only the display changes.
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_WPM_STATUS=y

# Run the OLED on a dedicated thread so display updates don't delay key scanning (fixes lag)
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Boost BLE transmit power for a stronger, more stable connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
