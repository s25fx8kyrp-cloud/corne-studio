CONFIG_ZMK_KEYBOARD_NAME="splitkeeby"
# Deep sleep re-enabled. The earlier diagnostic proved deep sleep was NOT the
# cause of the BT reconnection issue, so it's back on for battery life.
# Deep sleep powers the board (and OLED) down after 30 min of inactivity.
# We'll keep an eye on reconnection now that it's on again.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Idle (not deep sleep) after 30s of no keypresses. This is what triggers the
# OLED to switch from the status screen to the Matrix-rain screensaver. The
# board stays fully awake/connected; only the display changes.
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_DISPLAY=y

# Use our custom status screen (src/custom_status_screen.c): compact status while
# typing, Matrix-rain screensaver when idle. This replaces the stock widget
# screen, so the CONFIG_ZMK_WIDGET_* options below are no longer used.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Keep the OLED powered through the IDLE state so the rain is visible. Without
# this ZMK blanks the display on idle and the screensaver would never show.
# Deep sleep (30 min) still powers the panel off completely.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# 8x8 monospace bitmap font used for the rain characters and the status text,
# plus the LVGL label widget our custom screen draws everything with.
CONFIG_LV_FONT_UNSCII_8=y
CONFIG_LV_USE_LABEL=y

# These two widget options stay ON even though our custom screen never
# instantiates the stock widgets. They're load-bearing as feature flags:
#   - LAYER_STATUS pulls in LVGL labels AND compiles zmk_keymap_highest_layer_active()
#     (that helper is gated behind this option in v0.3).
#   - BATTERY_STATUS keeps the battery helpers/labels available.
# The widgets themselves are dead code here (not added to the screen), so this
# is cheap. WPM/OUTPUT widgets aren't needed, so they stay off.
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Run the OLED on a dedicated thread so display updates don't delay key scanning (fixes lag)
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Boost BLE transmit power for a stronger, more stable connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
