include:
  # ZMK Studio is enabled on the CENTRAL (left) half ONLY, via cmake-args here.
  # Do NOT put CONFIG_ZMK_STUDIO in the shared config/corne.conf — that compiles
  # it into the right (peripheral) half too and stops it from booting.
  - board: nice_nano_v2
    shield: corne_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano_v2
    shield: corne_right
  - board: nice_nano_v2
    shield: settings_reset
